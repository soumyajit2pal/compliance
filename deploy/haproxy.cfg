global
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 5m
    timeout server 5m

frontend portal_https
    # Take the source address from the accepted connection.
    bind "${PORTAL_EDGE_BIND}"
    default_backend portal_nginx

backend portal_nginx
    server nginx unix@/run/portal-edge/nginx.sock send-proxy-v2
