worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format portal '$proxy_protocol_addr $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout portal;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    upstream portal_backend {
        server backend:8000;
        keepalive 16;
    }

    map $uri $frontend_file {
        "/" /assets/index.html;
        default $uri;
    }

    map "$status:$uri" $frontend_cache_control {
        ~^(200|206|304):/assets/bundles/ "public, max-age=31536000, immutable";
        default "no-store";
    }

    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /ready {
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
            proxy_pass http://portal_backend/api/ready;
        }
        location / { return 404; }
    }

    server {
        listen unix:/run/portal-edge/nginx.sock ssl proxy_protocol;
        http2 on;
        ssl_certificate /run/portal/tls.crt;
        ssl_certificate_key /run/portal/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:portal_tls:4m;
        ssl_session_tickets off;
        root /srv/portal;
        if ($proxy_protocol_addr = "") { return 400; }

        # The application retains its endpoint-specific limits and file validation.
        client_max_body_size 101m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream off;
        proxy_redirect off;

        # The API controls permissions and headers for documents and UAT Swagger.
        location ~ ^/(?:api(?:/|$)|docs(?:/|$)|openapi\.json$) {
            proxy_pass http://portal_backend;
        }

        location ~ ^/(?:$|assets/) {
            try_files $frontend_file =404;
            add_header Cache-Control $frontend_cache_control always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
            gzip on;
            gzip_vary on;
            gzip_types text/css text/javascript application/javascript;
        }

        location / {
            return 404;
        }
    }
}
